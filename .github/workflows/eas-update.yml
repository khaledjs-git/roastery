name: EAS Update

on:
  repository_dispatch:
    types: [publish-preview, publish-production]

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}
          fetch-depth: 0

      - name: Determine channel
        id: channel
        run: |
          if [ "${{ github.event.action }}" = "publish-production" ]; then
            echo "channel=production" >> $GITHUB_OUTPUT
          else
            echo "channel=preview" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update to ${{ steps.channel.outputs.channel }}
        run: |
          eas update \
            --branch=${{ steps.channel.outputs.channel }} \
            --message="${{ github.event.client_payload.message || github.event.head_commit.message }}" \
            --non-interactive